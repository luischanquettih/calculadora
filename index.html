<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conversor de Días y Horas Laborales</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeaf4);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .contenedor{
      background:white;
      padding:35px;
      border-radius:20px;
      box-shadow:0 8px 20px rgba(255, 105, 180, 0.2);
      width:350px;
      border:2px solid #ffc1da;
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#d63384;
    }

    .grupo{
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#c2185b;
    }

    input{
      width:100%;
      padding:12px;
      border:2px solid #ffb6d5;
      border-radius:12px;
      font-size:16px;
      box-sizing:border-box;
      outline:none;
      transition:0.3s;
      background:#fff8fc;
    }

    input:focus{
      border-color:#ff69b4;
      box-shadow:0 0 8px rgba(255,105,180,0.4);
    }

    .resultado{
      margin-top:20px;
      background:#ffe0ef;
      padding:15px;
      border-radius:12px;
      font-size:18px;
      color:#ad1457;
      font-weight:bold;
      text-align:center;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h2>💖 Conversor Laboral 💖</h2>

    <div class="grupo">
      <label for="dias">Días laborales</label>
      <input type="number" id="dias" placeholder="Ejemplo: 5">
    </div>

    <div class="grupo">
      <label for="horas">Horas laborales</label>
      <input type="number" id="horas" placeholder="Ejemplo: 40">
    </div>

    <div class="resultado" id="resultado">
      Ingresa días u horas
    </div>
  </div>

  <script>
    const diasInput = document.getElementById("dias");
    const horasInput = document.getElementById("horas");
    const resultado = document.getElementById("resultado");

    const HORAS_POR_DIA = 8;

    diasInput.addEventListener("input", () => {
      const dias = parseFloat(diasInput.value);

      if (!isNaN(dias)) {
        const horas = dias * HORAS_POR_DIA;

        horasInput.value = horas;
        resultado.innerHTML = `
          🌸 ${dias} día(s) laborales = ${horas} hora(s)
        `;
      } else {
        horasInput.value = "";
        resultado.innerHTML = "Ingresa días u horas";
      }
    });

    horasInput.addEventListener("input", () => {
      const horas = parseFloat(horasInput.value);

      if (!isNaN(horas)) {
        const dias = horas / HORAS_POR_DIA;

        diasInput.value = dias;
        resultado.innerHTML = `
          ✨ ${horas} hora(s) = ${dias} día(s) laborales
        `;
      } else {
        diasInput.value = "";
        resultado.innerHTML = "Ingresa días u horas";
      }
    });
  </script>

</body>
</html>
