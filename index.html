<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Herramientas</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(135deg,#ffd6e7,#fff0f7);
        min-height:100vh;
        padding:20px;
        color:#5c255c;
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#d63384;
    }

    /* MENUS */
    .menus{
        display:flex;
        gap:15px;
        overflow-x:auto;
        padding-bottom:10px;
        margin-bottom:25px;
        scroll-behavior:smooth;
    }

    .menus::-webkit-scrollbar{
        height:8px;
    }

    .menus::-webkit-scrollbar-thumb{
        background:#ff9ac5;
        border-radius:20px;
    }

    .menu-card{
        min-width:220px;
        background:white;
        border-radius:20px;
        padding:20px;
        cursor:pointer;
        border:2px solid #ffc1da;
        transition:0.3s;
        box-shadow:0 5px 15px rgba(255,105,180,0.15);
        flex-shrink:0;
    }

    .menu-card:hover{
        transform:translateY(-5px);
        background:#fff7fb;
    }

    .menu-card.active{
        border:2px solid #ff4fa3;
        background:#ffe6f2;
    }

    .menu-card h3{
        margin-bottom:10px;
        color:#d63384;
    }

    /* CONTENIDO */
    .contenido{
        background:white;
        border-radius:25px;
        padding:25px;
        box-shadow:0 8px 20px rgba(255,105,180,0.15);
    }

    .grupo{
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#c2185b;
    }

    input{
        width:100%;
        padding:12px;
        border-radius:12px;
        border:2px solid #ffb6d5;
        outline:none;
        font-size:16px;
        background:#fff8fc;
    }

    input:focus{
        border-color:#ff69b4;
        box-shadow:0 0 8px rgba(255,105,180,0.4);
    }

    .resultado{
        margin-top:20px;
        background:#ffe0ef;
        padding:15px;
        border-radius:15px;
        text-align:center;
        font-weight:bold;
        font-size:18px;
        color:#ad1457;
    }

    /* BOTONES */
    .toggle-group{
        display:flex;
        gap:10px;
        flex-wrap:wrap;
    }

    .toggle-btn{
        padding:12px 18px;
        border:none;
        border-radius:12px;
        cursor:pointer;
        background:#ffd1e6;
        color:#ad1457;
        font-weight:bold;
        transition:0.3s;
    }

    .toggle-btn.active{
        background:#ff4fa3;
        color:white;
    }

    .hidden{
        display:none;
    }

    @media(max-width:600px){

        .contenido{
            padding:18px;
        }

        .menu-card{
            min-width:180px;
        }

    }
</style>
</head>

<body>

<h1>💖 Herramientas 💖</h1>

<!-- MENUS -->
<div class="menus">

    <div class="menu-card active" onclick="mostrarMenu('calculadora', this)">
        <h3>🧮 Calculadora</h3>
        <p>Convierte días laborales a horas.</p>
    </div>

    <div class="menu-card" onclick="mostrarMenu('cajaluz', this)">
        <h3>💡 Caja de Luz</h3>
        <p>Calcula m² y precio automáticamente.</p>
    </div>

</div>

<!-- CONTENIDO -->
<div class="contenido">

    <!-- CALCULADORA -->
    <div id="calculadora">

        <div class="grupo">
            <label>Días laborales</label>
            <input type="number" id="dias" placeholder="Ejemplo: 5">
        </div>

        <div class="grupo">
            <label>Horas laborales</label>
            <input type="number" id="horas" placeholder="Ejemplo: 40">
        </div>

        <div class="resultado" id="resultadoCalc">
            Ingresa días u horas
        </div>

    </div>

    <!-- CAJA DE LUZ -->
    <div id="cajaluz" class="hidden">

        <!-- UNIDAD -->
        <div class="grupo">
            <label>Unidad de medida</label>

            <div class="toggle-group">
                <button class="toggle-btn active unidad-btn" data-unidad="m">
                    Metros
                </button>

                <button class="toggle-btn unidad-btn" data-unidad="cm">
                    Centímetros
                </button>
            </div>
        </div>

        <!-- LADO -->
        <div class="grupo">
            <label>Tipo</label>

            <div class="toggle-group">
                <button class="toggle-btn active lado-btn" data-valor="600">
                    Un lado
                </button>

                <button class="toggle-btn lado-btn" data-valor="1200">
                    Doble lado
                </button>
            </div>
        </div>

        <!-- INPUTS -->
        <div class="grupo">
            <label>Ancho</label>
            <input type="number" id="ancho" placeholder="Ejemplo: 2">
        </div>

        <div class="grupo">
            <label>Alto</label>
            <input type="number" id="alto" placeholder="Ejemplo: 1">
        </div>

        <div class="resultado" id="resultadoCaja">
            Ingresa medidas
        </div>

    </div>

</div>

<script>

    /* ========= MENUS ========= */

    function mostrarMenu(id, elemento){

        document.getElementById("calculadora").classList.add("hidden");
        document.getElementById("cajaluz").classList.add("hidden");

        document.getElementById(id).classList.remove("hidden");

        document.querySelectorAll(".menu-card").forEach(card=>{
            card.classList.remove("active");
        });

        elemento.classList.add("active");
    }

    /* ========= CALCULADORA ========= */

    const diasInput = document.getElementById("dias");
    const horasInput = document.getElementById("horas");
    const resultadoCalc = document.getElementById("resultadoCalc");

    const HORAS_POR_DIA = 8;

    diasInput.addEventListener("input", () => {

        const dias = parseFloat(diasInput.value);

        if(!isNaN(dias)){

            const horas = dias * HORAS_POR_DIA;

            horasInput.value = horas;

            resultadoCalc.innerHTML =
                `🌸 ${dias} día(s) = ${horas} hora(s)`;

        }else{

            horasInput.value = "";
            resultadoCalc.innerHTML = "Ingresa días u horas";

        }

    });

    horasInput.addEventListener("input", () => {

        const horas = parseFloat(horasInput.value);

        if(!isNaN(horas)){

            const dias = horas / HORAS_POR_DIA;

            diasInput.value = dias;

            resultadoCalc.innerHTML =
                `✨ ${horas} hora(s) = ${dias} día(s)`;

        }else{

            diasInput.value = "";
            resultadoCalc.innerHTML = "Ingresa días u horas";

        }

    });

    /* ========= CAJA DE LUZ ========= */

let unidad = "m";
let precio = 600;

const anchoInput = document.getElementById("ancho");
const altoInput = document.getElementById("alto");
const resultadoCaja = document.getElementById("resultadoCaja");

/* ========= TOGGLE UNIDADES ========= */

document.querySelectorAll(".unidad-btn").forEach(btn=>{

    btn.addEventListener("click", ()=>{

        const nuevaUnidad = btn.dataset.unidad;

        // Si cambia de unidad
        if(nuevaUnidad !== unidad){

            let ancho = parseFloat(anchoInput.value);
            let alto = parseFloat(altoInput.value);

            // Convertir valores existentes
            if(!isNaN(ancho)){

                // m -> cm
                if(unidad === "m" && nuevaUnidad === "cm"){
                    ancho = ancho * 100;
                }

                // cm -> m
                else if(unidad === "cm" && nuevaUnidad === "m"){
                    ancho = ancho / 100;
                }

                anchoInput.value = parseFloat(ancho.toFixed(2));
            }

            if(!isNaN(alto)){

                // m -> cm
                if(unidad === "m" && nuevaUnidad === "cm"){
                    alto = alto * 100;
                }

                // cm -> m
                else if(unidad === "cm" && nuevaUnidad === "m"){
                    alto = alto / 100;
                }

                altoInput.value = parseFloat(alto.toFixed(2));
            }

            // Actualizar unidad actual
            unidad = nuevaUnidad;
        }

        // UI botones
        document.querySelectorAll(".unidad-btn").forEach(b=>{
            b.classList.remove("active");
        });

        btn.classList.add("active");

        calcularCaja();

    });

});

/* ========= TOGGLE LADOS ========= */

document.querySelectorAll(".lado-btn").forEach(btn=>{

    btn.addEventListener("click", ()=>{

        document.querySelectorAll(".lado-btn").forEach(b=>{
            b.classList.remove("active");
        });

        btn.classList.add("active");

        precio = parseFloat(btn.dataset.valor);

        calcularCaja();

    });

});

/* ========= EVENTOS ========= */

anchoInput.addEventListener("input", calcularCaja);
altoInput.addEventListener("input", calcularCaja);

/* ========= FUNCION ========= */

function calcularCaja(){

    let ancho = parseFloat(anchoInput.value);
    let alto = parseFloat(altoInput.value);

    if(isNaN(ancho) || isNaN(alto)){

        resultadoCaja.innerHTML = "Ingresa medidas";
        return;
    }

    // Convertir siempre a metros
    let anchoMetros = ancho;
    let altoMetros = alto;

    if(unidad === "cm"){

        anchoMetros = ancho / 100;
        altoMetros = alto / 100;

    }

    const metros2 = anchoMetros * altoMetros;
    const total = metros2 * precio;

    resultadoCaja.innerHTML = `
        📐 Área: ${metros2.toFixed(2)} m²
        <br><br>
        💰 Total: S/ ${total.toFixed(2)}
    `;
}

</script>

</body>
</html>
